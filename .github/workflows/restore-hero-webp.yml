name: Restore hero as transparent WebP

on:
  push:
    paths:
      - '.github/workflows/restore-hero-webp.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert restored PNG to WebP
        run: |
          test -s assets/hero-tech-duo-restored.png
          cwebp -quiet -q 96 -alpha_q 100 -m 6 assets/hero-tech-duo-restored.png -o assets/hero-tech-duo-hq.webp
          test -s assets/hero-tech-duo-hq.webp
          file assets/hero-tech-duo-hq.webp

      - name: Point site to restored WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('/assets/hero-tech-duo-hq.jpg?v=20260929','/assets/hero-tech-duo-hq.webp?v=20260929c')
          p.write_text(s)
          PY

      - name: Remove temporary PNG source
        run: rm assets/hero-tech-duo-restored.png

      - name: Commit restored hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hero-tech-duo-hq.webp
          git add -u assets/hero-tech-duo-restored.png
          git diff --cached --quiet && exit 0
          git commit -m 'Restore hero as transparent WebP'
          git push
