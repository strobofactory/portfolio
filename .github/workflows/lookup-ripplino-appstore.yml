name: Lookup Ripplino App Store URL

on:
  push:
    paths:
      - '.github/workflows/lookup-ripplino-appstore.yml'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query Apple Lookup API
        run: |
          curl -L --fail --silent --show-error 'https://itunes.apple.com/lookup?bundleId=com.strobofactory.cascadepuzzle&country=jp' | python -m json.tool
