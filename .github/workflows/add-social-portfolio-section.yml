l-index">06 / EDUCATION</span><div><h3>Houkago Challenge</h3><p>Benesse / aproximadamente cinco vídeos</p></div><span class="social-arrow">↗</span></a>\n<a class="social-card" href="https://www.youtube.com/channel/UCIg4JZi3ZSVcqjVMFcOHiOw" target="_blank" rel="noreferrer"><span class="social-index">07 / ENTERTAINMENT</span><div><h3>Ryuji Harada no Yu-Tube!</h3><p>Edición y trabajo en rodaje en varios episodios</p></div><span class="social-arrow">↗</span></a>\n<a class="social-card" href="https://www.youtube.com/channel/UC4YaOt1yT-ZeyB0OmxHgolA" target="_blank" rel="noreferrer"><span class="social-index">08 / VTUBER</span><div><h3>Kizuna AI</h3><p>Edición de numerosos vídeos</p></div><span class="social-arrow">↗</span></a>\n<a class="social-card" href="https://www.youtube.com/channel/UCezfmwKc2B8dtVIAgRHXrKQ" target="_blank" rel="noreferrer"><span class="social-index">09 / VTUBER</span><div><h3>Yume Kotobuki</h3><p>Edición de numerosos vídeos</p></div><span class="social-arrow">↗</span></a>\n<a class="social-card" href="https://www.youtube.com/playlist?list=PLG5UDSnEeEWNNFRDhn320rm7IgqWH9N0H" target="_blank" rel="noreferrer"><span class="social-index">10 / TOURISM</span><div><h3>Kawagoe style</h3><p>Canal turístico de Kawagoe / desde planificación hasta producción</p></div><span class="social-arrow">↗</span></a>\n</div></section>\n'''
