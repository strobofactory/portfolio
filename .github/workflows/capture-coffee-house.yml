name: Capture Coffee House portfolio

on:
  push:
    paths:
      - '.github/workflows/capture-coffee-house.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture site
        run: |
          cat > capture-coffee.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });
          await page.goto('https://thecoffeehouselist.com/', { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForTimeout(5000);
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.waitForTimeout(500);
          await page.screenshot({
            path: 'assets/the-coffee-house-site.jpg',
            type: 'jpeg',
            quality: 90,
            fullPage: false
          });
          await browser.close();
          EOF
          node ./capture-coffee.mjs
          rm capture-coffee.mjs

      - name: Validate screenshot
        run: |
          test -s assets/the-coffee-house-site.jpg
          file assets/the-coffee-house-site.jpg

      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/the-coffee-house-site.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add THE COFFEE HOUSE portfolio screenshot'
          git push
