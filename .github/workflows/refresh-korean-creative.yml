name: Refresh Korean Creative page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-korean-creative.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Korean page language selector and fresh script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('creative/ko.html')
          s = p.read_text()
          nav_old = '<a href="https://strobofactory.net/" target="_blank" rel="noreferrer">Company ↗</a></nav>'
          nav_new = '''<a href="https://strobofactory.net/" target="_blank" rel="noreferrer">Company ↗</a><select class="language-select" aria-label="언어 선택" onchange="if(this.value) location.href=this.value"><option value="/">일본어</option><option value="/en.html">영어</option><option value="/es.html">스페인어</option><option value="/zh.html">중국어</option><option value="/ko.html" selected>한국어</option></select></nav>'''
          if nav_old in s:
              s = s.replace(nav_old, nav_new, 1)
          s = s.replace('<script src="/script.js" defer></script>', '<script src="/script.js?v=20260909-ko-refresh" defer></script>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creative/ko.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Korean Creative page and selector'
          git push
