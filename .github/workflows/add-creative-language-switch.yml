name: Add Creative language switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-creative-language-switch.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add English switch to Japanese page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('creative/index.html')
          s = p.read_text()
          old = '''      <a href="https://strobofactory.net/" target="_blank" rel="noreferrer">会社情報 ↗</a>\n    </nav>'''
          new = '''      <a href="https://strobofactory.net/" target="_blank" rel="noreferrer">会社情報 ↗</a>\n      <a href="/en.html" lang="en" aria-label="Switch to English">EN</a>\n    </nav>'''
          if old not in s:
              raise SystemExit('nav target not found')
          s = s.replace(old, new, 1)
          old_footer = '''      <a href="https://www.instagram.com/strobofactory/" target="_blank" rel="noreferrer">Instagram</a>\n    </div>'''
          new_footer = '''      <a href="https://www.instagram.com/strobofactory/" target="_blank" rel="noreferrer">Instagram</a>\n      <a href="/en.html" lang="en">English</a>\n    </div>'''
          if old_footer in s:
              s = s.replace(old_footer, new_footer, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creative/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add English language switch to Creative'
          git push
