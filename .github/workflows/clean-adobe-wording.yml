name: Clean Adobe wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-adobe-wording.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('creative/index.html')
          s = p.read_text()
          s = s.replace(
            'Premiere Pro、After Effects、Photoshop、Illustrator等は案件に応じて弊社スタッフ体制で対応可能です。',
            'Premiere Pro、After Effects、Photoshop、Illustrator等にも対応しています。'
          )
          p.write_text(s)
          PY
          rm .github/workflows/clean-adobe-wording.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creative/index.html .github/workflows/clean-adobe-wording.yml
          git commit -m 'Simplify Adobe capability wording'
          git push
