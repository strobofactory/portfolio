name: Capture LP portfolio screenshots

on:
  push:
    paths:
      - '.github/workflows/capture-lp-portfolio.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture landing pages
        run: |
          cat > capture-lp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless: true});
          const targets = [
            ['https://sweepline.strobofactory.net/', 'assets/lp-sweepline.jpg'],
            ['https://pkpassport.strobofactory.net/', 'assets/lp-pkpassport.jpg'],
          ];

          for (const [url, output] of targets) {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
            });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(5000);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(500);
            await page.screenshot({ path: output, type: 'jpeg', quality: 88, fullPage: false });
            await page.close();
          }

          await browser.close();
          EOF
          node ./capture-lp.mjs
          rm capture-lp.mjs

      - name: Validate screenshots
        run: |
          test -s assets/lp-sweepline.jpg
          test -s assets/lp-pkpassport.jpg
          file assets/lp-sweepline.jpg assets/lp-pkpassport.jpg

      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lp-sweepline.jpg assets/lp-pkpassport.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add LP portfolio screenshots'
          git push
