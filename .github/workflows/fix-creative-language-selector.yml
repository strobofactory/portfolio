name: Fix Creative language selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creative-language-selector.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace language links with selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
    .language-select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:10px;letter-spacing:.06em;padding:8px 28px 8px 10px;cursor:pointer;border-radius:0;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
    .language-select:focus{outline:1px solid var(--accent);outline-offset:2px}
    @media(max-width:760px){.language-select{font-size:9px;padding:7px 26px 7px 9px}}
'''

          def update(path, current, options, footer_old, footer_new):
              p = Path(path)
              s = p.read_text()
              marker = '  </style>'
              if '.language-select{' not in s:
                  s = s.replace(marker, css + marker, 1)
              # remove old simple language link and install selector
              old_links = [
                  '      <a href="/en.html" lang="en" aria-label="Switch to English">EN</a>\n',
                  '      <a href="/" lang="ja" aria-label="日本語版に切り替える">JP</a>\n'
              ]
              for old in old_links:
                  s = s.replace(old, '')
              selector = f'''      <select class="language-select" aria-label="Language" onchange="if(this.value) window.location.href=this.value;">\n{options}\n      </select>\n'''
              nav_end = '    </nav>'
              s = s.replace(nav_end, selector + nav_end, 1)
              s = s.replace(footer_old, footer_new)
              p.write_text(s)

          update(
              'creative/index.html',
              '/',
              '        <option value="/" selected>日本語</option>\n        <option value="/en.html">English</option>',
              '      <a href="/en.html" lang="en">English</a>\n',
              ''
          )
          update(
              'creative/en.html',
              '/en.html',
              '        <option value="/">日本語</option>\n        <option value="/en.html" selected>English</option>',
              '      <a href="/" lang="ja">日本語</a>\n',
              ''
          )
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creative/index.html creative/en.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use explicit Japanese English language selector'
          git push
