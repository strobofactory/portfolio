name: Apply language button selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-button.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load button selector on Products site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/site.js')
          s = p.read_text()
          old = "html = html.replace('</body>', '<script src=\"/products-i18n.js\"></script><script src=\"/products-i18n-long.js\"></script></body>');"
          new = "html = html.replace('</body>', '<script src=\"/products-i18n.js\"></script><script src=\"/products-i18n-long.js\"></script><script src=\"/products-lang-ui.js\"></script></body>');"
          if old not in s:
              raise SystemExit('target script loader not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/site.js
          git commit -m 'Use button-based language selector'
          git push