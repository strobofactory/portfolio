name: Capture yamago LP portfolio

on:
  push:
    paths:
      - '.github/workflows/capture-yamago-lp.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium

      - name: Capture yamago landing page
        run: |
          cat > capture-yamago.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });
          await page.goto('https://yamago.hapiveri.com/', { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForTimeout(5000);
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.waitForTimeout(500);
          await page.screenshot({
            path: 'assets/lp-yamago.jpg',
            type: 'jpeg',
            quality: 90,
            fullPage: false
          });
          await browser.close();
          EOF
          node ./capture-yamago.mjs
          rm capture-yamago.mjs

      - name: Validate screenshot
        run: |
          test -s assets/lp-yamago.jpg
          file assets/lp-yamago.jpg

      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lp-yamago.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add yamago LP portfolio screenshot'
          git pull --rebase origin main
          git push
